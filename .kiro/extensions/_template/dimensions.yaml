# {团队}维度知识（精简版模板）
# 只保留 AI/API 查不到的经验：编码对齐坑 + 使用注意事项
# 层次定义、SCD 类型等通用知识由 AI 自行推理，无需填写

dimensions:

  - name: # 维度名称（业务语义名）
    dim_table: # 维表名（或"无（退化到事实表）"）
    key: [] # 主键字段
    cross_system_alignment: # 跨系统编码对齐的坑（选填，无跨系统场景可删此项）
      - # 系统A字段 与 系统B字段 的对齐规则/转换注意事项
    usage_notes: # AI 自己推不出来的使用经验
      - # 注意事项1
      - # 注意事项2
