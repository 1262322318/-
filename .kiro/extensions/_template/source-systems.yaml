# {团队} 源系统缓存（source-systems.yaml）
# 只存"坑和经验"，字段列表走平台 API。

systems:
  - id: "{系统标识}"
    name: "{系统名称}"
    入湖就绪: "HH:MM"
    入湖方式: "增量同步/全量快照"
    tables:
      - name: "{ODS表名}"
        用途: "{一句话描述}"
        坑:
          - "{数据质量问题/易踩坑点}"

关联关系:
  - key: "{系统A.字段 = 系统B.字段}"
    注意: "{延迟/不一致/特殊处理}"
