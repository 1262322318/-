    description: 多产品线分叉统一汇总——每条产品线独立段落INSERT，ADS层统一聚合
  - pattern: bp-lx-priority-select
    description: BP/LX优先选择——DWD层展开为统一粒度，DWS层按立项首月判断选用

# ═══ 复杂度评估 ═══
complexity:
  level: 复杂
  factors:
    - 覆盖内9+外7条产品线，各有差异
    - DWD→DWS→ADS三层完整链路
    - 涉及9条公共规则（PUB-001~010）
    - 日立/央空走特殊口径（sale_model_code）
    - 外销独立脚本（GSS数据源）
    - 多次产品线扩展（厨电、激光、外销先后合入）
  scripts_count: 5
  total_changes: 8次变更（changelog记录）
